<aside class="card sidebar">
  <a href="{{ user.dashboard_url }}">Dashboard</a>
  {% if user.role == 'student' %}
    <a href="{% url 'projects:list' %}">My Projects</a>
    <a href="{% url 'projects:create' %}">New Project</a>
    <a href="{% url 'projects:my_changes' %}">My Submissions</a>
  {% else %}
    <a href="{% url 'projects:list' %}">All Projects</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Django Admin</a>{% endif %}
  {% endif %}
  <a href="{% url 'accounts:profile' %}">My Profile</a>
</aside>
