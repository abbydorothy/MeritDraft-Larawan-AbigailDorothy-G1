{% extends "base.html" %}{% block title %}Edit Profile · MeritDraft{% endblock %}
{% block content %}
<div class="layout">{% include "accounts/_sidebar.html" %}
<section class="card">
  <h1>Edit Profile</h1>
  <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
    {{ form.non_field_errors }}
    {% include "accounts/_form_fields.html" %}
    <button class="btn" type="submit">Save changes</button>
    <a class="btn secondary" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</section></div>
{% endblock %}
