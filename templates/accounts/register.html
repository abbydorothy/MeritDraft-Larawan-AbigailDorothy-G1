{% extends "base.html" %}{% block title %}Register · MeritDraft{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create account</h1>
  <p class="muted">See who really wrote the paper.</p>
  <form method="post" novalidate>{% csrf_token %}
    {{ form.non_field_errors }}
    {% include "accounts/_form_fields.html" %}
    <button class="btn" type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
